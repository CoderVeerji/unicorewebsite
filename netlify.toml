# Netlify build settings.
#
# The repo does not contain dist/ — it is gitignored and Netlify builds it.
# Connect this repository in Netlify and it reads everything it needs from
# here; there is nothing to set in the dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Keep in step with .nvmrc. Astro 7 needs 18.20.8+, 20.3+ or 22+.
  NODE_VERSION = "22.23.4"

# Astro fingerprints everything under /_astro/, so those files can never go
# stale — cache them hard. Everything else keeps Netlify's default, which
# revalidates on each request.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
